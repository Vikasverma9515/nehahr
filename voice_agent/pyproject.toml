[project]
name = "neha-voice-agent"
version = "0.1.0"
description = "Neha's real-time voice agent on LiveKit Agents: phone (SIP), browser playground, interview room and Google Meet"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[deepgram,anthropic,cartesia,elevenlabs,silero,tavus]~=1.8",
    "livekit-api>=1.0.0",
    "anthropic[bedrock]>=0.40",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["neha_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
