[project]
name = "neha-backend"
version = "0.2.0"
description = "Neha AI HR Agent - FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.0.0",
    "twilio>=9.0.0",
    "supabase>=2.10.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "PyJWT[crypto]>=2.8.0",
    "phonenumbers>=8.13.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-multipart>=0.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
