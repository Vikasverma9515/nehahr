<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Neha, the AI HR agent that picks up the phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a12"/>
      <stop offset="0.6" stop-color="#140f24"/>
      <stop offset="1" stop-color="#241542"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- decorative waveform -->
  <g fill="url(#wave)" opacity="0.55">
    <rect x="800" y="150" width="8" height="40" rx="4"/><rect x="822" y="128" width="8" height="84" rx="4"/>
    <rect x="844" y="104" width="8" height="132" rx="4"/><rect x="866" y="132" width="8" height="76" rx="4"/>
    <rect x="888" y="88" width="8" height="164" rx="4"/><rect x="910" y="114" width="8" height="112" rx="4"/>
    <rect x="932" y="70" width="8" height="200" rx="4"/><rect x="954" y="100" width="8" height="140" rx="4"/>
    <rect x="976" y="58" width="8" height="224" rx="4"/><rect x="998" y="96" width="8" height="148" rx="4"/>
    <rect x="1020" y="80" width="8" height="180" rx="4"/><rect x="1042" y="118" width="8" height="104" rx="4"/>
    <rect x="1064" y="90" width="8" height="160" rx="4"/><rect x="1086" y="126" width="8" height="88" rx="4"/>
    <rect x="1108" y="106" width="8" height="128" rx="4"/><rect x="1130" y="138" width="8" height="64" rx="4"/>
    <rect x="1152" y="122" width="8" height="96" rx="4"/><rect x="1174" y="148" width="8" height="44" rx="4"/>
  </g>

  <!-- logo tile -->
  <g transform="translate(84 92)">
    <rect width="96" height="96" rx="29" fill="url(#tile)"/>
    <path d="M27 72V24l42 48V24" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="16" r="6" fill="#ede9fe"/>
  </g>

  <text x="212" y="152" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2">Neha</text>
  <text x="214" y="190" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#a78bfa" letter-spacing="4">AI HR AGENT</text>

  <text x="84" y="252" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#e9e7f5">The AI recruiter that picks up the phone.</text>
  <text x="84" y="290" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9b98b8">Screens candidates, books interviews and follows up, for any company.</text>
</svg>
